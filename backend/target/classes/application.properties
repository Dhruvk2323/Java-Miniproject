# =======================================================
# Expense Tracker - Spring Boot Backend Configuration
# Aligned with DBIT Full Stack Java Lab Manual (Exp 12)
# =======================================================

spring.application.name=expense-tracker-backend
server.port=8080

# Active Profile: set to 'h2' for zero-config instant demonstration,
# or set to 'mysql' (or comment out) when connecting to local MySQL Server.
spring.profiles.active=h2

# ----------------- MySQL DataSource Configuration (Exp 6 & 12) -----------------
spring.datasource.url=jdbc:mysql://localhost:3306/expensetracker_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Logging
logging.level.com.expensetracker=DEBUG
logging.level.org.springframework.web=INFO
