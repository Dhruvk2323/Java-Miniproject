# =======================================================
# Expense Tracker - Spring Boot Backend Configuration
# DBIT Full Stack Java Lab Manual (Exp 12)
# Local MySQL on your PC
# =======================================================

spring.application.name=expense-tracker-backend
server.port=8080

# Use MySQL locally
spring.profiles.active=mysql

# ----------------- MySQL DataSource (Local PC) -----------------
spring.datasource.url=jdbc:mysql://localhost:3306/expensetracker_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=mysql@442
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Logging
logging.level.com.expensetracker=DEBUG
logging.level.org.springframework.web=INFO
