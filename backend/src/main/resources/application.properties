# =======================================================
# Expense Tracker - Spring Boot Backend Configuration
# Aligned with DBIT Full Stack Java Lab Manual (Exp 12)
# Cloud Deployment (Render / Railway) - Env vars override local defaults
# =======================================================

spring.application.name=expense-tracker-backend

# Server port - Render/Railway inject PORT env var
server.port=${PORT:8080}

# Active Profile: 'mysql' in production
spring.profiles.active=${SPRING_PROFILES_ACTIVE:h2}

# ----------------- MySQL DataSource Configuration (Exp 6 & 12) -----------------
# Render / Railway / Clever Cloud provide DB_URL, DB_USERNAME, DB_PASSWORD
spring.datasource.url=${DB_URL:${MYSQL_URL:jdbc:mysql://localhost:3306/expensetracker_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}}
spring.datasource.username=${DB_USERNAME:${MYSQLUSER:root}}
spring.datasource.password=${DB_PASSWORD:${MYSQLPASSWORD:password}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Logging
logging.level.com.expensetracker=DEBUG
logging.level.org.springframework.web=INFO
