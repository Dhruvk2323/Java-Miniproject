# =======================================================
# Expense Tracker - Spring Boot Backend Configuration
# Aligned with DBIT Full Stack Java Lab Manual (Exp 12)
# Railway Cloud Deployment - Env vars override local defaults
# =======================================================

spring.application.name=expense-tracker-backend

# Server port - Railway injects PORT env var
server.port=${PORT:8080}

# Active Profile: 'mysql' in production (Railway sets SPRING_PROFILES_ACTIVE=mysql)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:h2}

# ----------------- MySQL DataSource Configuration (Exp 6 & 12) -----------------
# Railway provides MYSQL_URL, MYSQLUSER, MYSQLPASSWORD env vars automatically
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/expensetracker_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Logging
logging.level.com.expensetracker=DEBUG
logging.level.org.springframework.web=INFO
